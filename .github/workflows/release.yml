name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = (python -c "import stemsplitter; print(stemsplitter.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $v" }

      - name: Import check
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import onnxruntime, audio_separator.separator; from stemsplitter import engine, gui; print('ok')"

      - name: Package
        shell: pwsh
        run: |
          $name = "StemSplitter-${{ github.ref_name }}-windows"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item app.py, requirements.txt, setup.bat, run.bat, run_debug.bat, README.md, LICENSE -Destination $dir
          Copy-Item -Recurse stemsplitter -Destination "$dir/stemsplitter"
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $dir | Remove-Item -Recurse -Force
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Download

            1. Download **StemSplitter-${{ github.ref_name }}-windows.zip** below and extract it.
            2. Double-click **run.bat**. The first start installs Python (if needed), PyTorch and the other packages, about 3-4 GB. This happens only once.
            3. Drop songs in and press **Split stems**. Each model downloads the first time it is used.

            Windows 10/11 64-bit. An NVIDIA GPU is strongly recommended. See the README for details.
